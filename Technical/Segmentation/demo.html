<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourSpace - Segmentation Demo</title>
    <style>
        :root {
            --bg: #111827;
            --panel: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --danger: #b91c1c;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 320px 1fr;
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        aside {
            background: var(--panel);
            padding: 20px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        main {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        p {
            margin: 0 0 16px;
            color: var(--muted);
            line-height: 1.45;
            font-size: 14px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        input,
        button {
            width: 100%;
            min-height: 40px;
            border-radius: 8px;
            font: inherit;
        }

        input[type="text"] {
            border: 1px solid var(--border);
            padding: 0 10px;
        }

        input[type="file"] {
            border: 1px solid var(--border);
            padding: 8px;
        }

        button {
            border: 0;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .secondary {
            background: #0f766e;
        }

        .secondary:hover:not(:disabled) {
            background: #115e59;
        }

        #status {
            min-height: 58px;
            padding: 10px;
            border-radius: 8px;
            background: #f3f4f6;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        #status.error {
            color: var(--danger);
            background: #fee2e2;
        }

        #frame {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
            cursor: crosshair;
        }

        #target,
        #overlay {
            display: block;
            max-width: calc(100vw - 380px);
            max-height: calc(100vh - 48px);
            user-select: none;
        }

        #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #marker {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid white;
            background: var(--primary);
            box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.35);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 12px 0 0;
            padding: 10px;
            border-radius: 8px;
            background: #111827;
            color: #d1d5db;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <aside>
        <h1>SAM2 Segmentation Test</h1>
        <p>Upload anh, tap vao object/furniture, xem mask overlay va export rieng cho Inpainting.</p>

        <div class="field">
            <label for="api-base">API base</label>
            <input id="api-base" type="text" value="http://127.0.0.1:7861">
        </div>

        <div class="field">
            <label for="image-upload">Anh test</label>
            <input id="image-upload" type="file" accept="image/*">
        </div>

        <button id="health-btn">Kiem tra service</button>
        <button id="export-btn" class="secondary" disabled>Export image + mask</button>

        <div id="status">Chua co anh. Hay upload anh test truoc.</div>
        <pre id="metadata" class="hidden"></pre>
    </aside>

    <main>
        <div id="frame" class="hidden">
            <img id="target" alt="Segmentation target">
            <img id="overlay" class="hidden" alt="Mask overlay">
            <div id="marker" class="hidden"></div>
        </div>
    </main>

    <script>
        const apiBaseInput = document.getElementById('api-base');
        const imageUpload = document.getElementById('image-upload');
        const healthBtn = document.getElementById('health-btn');
        const exportBtn = document.getElementById('export-btn');
        const statusBox = document.getElementById('status');
        const metadataBox = document.getElementById('metadata');
        const frame = document.getElementById('frame');
        const target = document.getElementById('target');
        const overlay = document.getElementById('overlay');
        const marker = document.getElementById('marker');

        let imageDataUrl = null;
        let lastResult = null;
        let lastTap = null;

        imageUpload.addEventListener('change', () => {
            const file = imageUpload.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                imageDataUrl = reader.result;
                lastResult = null;
                lastTap = null;
                target.src = imageDataUrl;
                overlay.classList.add('hidden');
                marker.classList.add('hidden');
                frame.classList.remove('hidden');
                exportBtn.disabled = true;
                metadataBox.classList.add('hidden');
                setStatus('Anh da san sang. Tap vao object trong anh de tao mask.');
            };
            reader.readAsDataURL(file);
        });

        healthBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`${apiBase()}/health`);
                const body = await response.json();
                setStatus(`Service OK. model_loaded=${body.model_loaded}, device=${body.model.device}`);
                showMetadata(body);
            } catch (error) {
                setStatus(`Khong goi duoc /health: ${error.message}`, true);
            }
        });

        frame.addEventListener('click', async (event) => {
            if (!imageDataUrl) {
                setStatus('Hay upload anh truoc.', true);
                return;
            }

            const point = imagePointFromClick(event);
            if (!point) return;

            setMarker(event);
            exportBtn.disabled = true;
            setStatus(`Dang segment tai pixel (${point.x}, ${point.y})...`);

            try {
                const response = await fetch(`${apiBase()}/api/v1/segment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageDataUrl,
                        x: point.x,
                        y: point.y,
                        label: 1,
                    }),
                });
                const body = await response.json();
                if (!response.ok) {
                    throw new Error(body.detail || 'Segmentation failed');
                }

                lastResult = body;
                lastTap = point;
                overlay.src = `data:image/png;base64,${body.overlay_png_base64}`;
                overlay.classList.remove('hidden');
                exportBtn.disabled = false;
                setStatus(`Mask OK. score=${body.score.toFixed(4)}, bbox=${body.bbox.join(', ')}`);
                showMetadata(body);
            } catch (error) {
                setStatus(`Khong tao duoc mask: ${error.message}`, true);
            }
        });

        exportBtn.addEventListener('click', async () => {
            if (!lastResult) return;

            setStatus('Dang export vao Segmentation/outputs...');
            exportBtn.disabled = true;

            try {
                const metadata = {
                    source: 'Segmentation/demo.html',
                    tap: lastTap,
                    bbox: lastResult.bbox,
                    score: lastResult.score,
                    image_size: lastResult.image_size,
                    model: lastResult.model,
                    exported_at: new Date().toISOString(),
                };
                const response = await fetch(`${apiBase()}/api/v1/export`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageDataUrl,
                        mask: lastResult.mask_png_base64,
                        overlay: lastResult.overlay_png_base64,
                        metadata,
                    }),
                });
                const body = await response.json();
                if (!response.ok) {
                    throw new Error(body.detail || 'Export failed');
                }
                setStatus(`Da export thanh cong: ${body.folder}`);
                showMetadata(body);
            } catch (error) {
                setStatus(`Export loi: ${error.message}`, true);
            } finally {
                exportBtn.disabled = false;
            }
        });

        function apiBase() {
            return apiBaseInput.value.replace(/\/$/, '');
        }

        function imagePointFromClick(event) {
            const rect = target.getBoundingClientRect();
            const rx = event.clientX - rect.left;
            const ry = event.clientY - rect.top;
            if (rx < 0 || ry < 0 || rx > rect.width || ry > rect.height) return null;

            return {
                x: Math.max(0, Math.min(target.naturalWidth - 1, Math.round(rx / rect.width * target.naturalWidth))),
                y: Math.max(0, Math.min(target.naturalHeight - 1, Math.round(ry / rect.height * target.naturalHeight))),
            };
        }

        function setMarker(event) {
            const rect = frame.getBoundingClientRect();
            marker.style.left = `${event.clientX - rect.left}px`;
            marker.style.top = `${event.clientY - rect.top}px`;
            marker.classList.remove('hidden');
        }

        function setStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.classList.toggle('error', isError);
        }

        function showMetadata(value) {
            metadataBox.textContent = JSON.stringify(value, null, 2);
            metadataBox.classList.remove('hidden');
        }
    </script>
</body>

</html>
